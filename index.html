<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ledger — connection test</title>
</head>
<body style="margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#0e5b71;color:#ffffff;min-height:100vh;display:grid;place-items:center;padding:24px;">
  <div style="max-width:440px;text-align:center;">
    <div style="font-size:52px;line-height:1;">✓</div>
    <h1 style="margin:12px 0 6px;font-size:23px;">This page is working</h1>
    <p style="opacity:.92;line-height:1.55;margin:0 0 18px;">If you can read this on a teal background, your browser is rendering the file correctly. Now testing whether it can load a library from the internet…</p>
    <div id="net" style="padding:13px 15px;border-radius:11px;background:rgba(255,255,255,.16);font-weight:600;line-height:1.45;">Testing…</div>
    <p style="opacity:.7;font-size:12.5px;margin:18px 0 0;">Tell me: (1) the background color you see, and (2) what the box above says.</p>
  </div>
  <script>
    var el = document.getElementById("net");
    var s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js";
    s.onload = function () {
      if (window.React) {
        el.style.background = "rgba(70,200,130,.4)";
        el.textContent = "✓ Loaded a library from the internet — your setup can run the full app.";
      } else {
        el.style.background = "rgba(255,120,90,.5)";
        el.textContent = "✗ The script ran, but the library was not found.";
      }
    };
    s.onerror = function () {
      el.style.background = "rgba(255,120,90,.5)";
      el.textContent = "✗ Could not load the library from the internet — a network issue or an ad/script blocker is stopping it.";
    };
    document.head.appendChild(s);
  </script>
</body>
</html>
